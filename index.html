<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07070b">
  <meta name="description" content="موسوعة تفاعلية لفهم السلوك البشري، كشف التلاعب النفسي، وبناء الوعي والحدود الصحية.">
  <title>الظل | موسوعة علم النفس المظلم</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="القائمة الرئيسية">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M24 4 42 14v20L24 44 6 34V14L24 4Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 24c4-7 9-10 14-10s10 3 14 10c-4 7-9 10-14 10S14 31 10 24Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="24" cy="24" r="4" fill="currentColor"/></svg>
        </div>
        <div><strong>الظِّل</strong><span>DARK MIND • مكتبة العقل</span></div>
      </div>
      <div class="side-caption">استكشف أعماق السلوك</div>
      <nav class="nav-list">
        <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span><span>الرئيسية</span></button>
        <button class="nav-item" data-page="learn"><span class="nav-icon">◈</span><span>أساسيات النفس</span></button>
        <button class="nav-item" data-page="spot"><span class="nav-icon">◉</span><span>اكشف التلاعب</span><i class="nav-dot"></i></button>
        <button class="nav-item" data-page="cases"><span class="nav-icon">⌕</span><span>القضايا التفاعلية</span></button>
        <button class="nav-item" data-page="lab"><span class="nav-icon">✧</span><span>مختبر العقل</span></button>
        <button class="nav-item" data-page="quiz"><span class="nav-icon">◎</span><span>اختبر ملاحظتك</span></button>
        <button class="nav-item" data-page="library"><span class="nav-icon">▤</span><span>مكتبة الكتب</span></button>
        <button class="nav-item" data-page="notes"><span class="nav-icon">▧</span><span>دفتر التأمل</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="candle-mini" aria-hidden="true"><span class="candle-flame"></span><span class="candle-wax"></span><span class="candle-glow"></span></div>
        <p>«افهم الظلال…<br>كي لا تقودك من حيث لا ترى.»</p>
        <button class="nav-item about-link" data-page="about"><span class="nav-icon">ⓘ</span><span>عن الموسوعة</span></button>
        <div class="side-foot">صنع بيد سيف <span>✦</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuToggle" aria-label="فتح القائمة">☰</button>
        <div class="breadcrumb"><span>موسوعة الظل</span><b>/</b><strong id="pageLabel">الرئيسية</strong></div>
        <div class="top-actions">
          <button class="search-trigger" id="searchOpen"><span>⌕</span><span>ابحث عن فكرة أو مصطلح...</span><kbd>⌘ K</kbd></button>
          <button class="icon-button" id="dailyButton" title="رسالة اليوم" aria-label="رسالة اليوم">✧</button>
        </div>
      </header>
      <div class="mobile-overlay" id="mobileOverlay"></div>
      <section class="page-content" id="pageContent" tabindex="-1"></section>
      <footer class="page-footer"><span>الظِّل — المعرفة بداية الوعي</span><span>محتوى تعليمي، لا تشخيص نفسي</span></footer>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="إغلاق">×</button>
      <div id="modalContent"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
